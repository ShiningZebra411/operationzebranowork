<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: repeating-linear-gradient(
            45deg,
            #000,
            #000 20px,
            #fff 20px,
            #fff 40px
        );
    }

    #emulator_target {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 100vw;
        height: 100vh;
        image-rendering: pixelated;
    }
</style>
