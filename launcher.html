<!DOCTYPE html>
<html>
    <head>
        <title>GBA Emulator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /* Custom styles for the message box */
            .message-box {
                padding: 0.75rem 1.25rem;
                border-radius: 0.5rem;
                font-weight: 500;
                text-align: center;
                margin-top: 1rem;
                transition: opacity 0.3s ease-in-out;
                max-width: 400px;
                margin-left: auto;
                margin-right: auto;
            }
            .message-box.success {
                background-color: #d1fae5; /* green-100 */
                color: #065f46; /* green-800 */
            }
            .message-box.error {
                background-color: #fee2e2; /* red-100 */
                color: #991b1b; /* red-800 */
            }
            .message-box.info {
                background-color: #e0f2fe; /* blue-100 */
                color: #1e40af; /* blue-800 */
            }
            .message-box.hidden {
                opacity: 0;
                pointer-events: none; /* Make it not clickable when hidden */
            }
            body {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background-color: #f0f0f0;
                font-family: sans-serif;
                padding: 20px; /* Add some padding around the content */
                box-sizing: border-box; /* Include padding in element's total width and height */
            }
                 #emulator_target {
            width: 720px;
            height: 480px;
            max-width: 100%;
            height: auto;
            image-rendering: pixelated;
            border: 4px solid #333;
            border-radius: 8px;
            display: block;
            margin: 0 auto;
           }

            }
        </style>
        <script src="IodineGBA/includes/TypedArrayShim.js"></script>
        <script src="IodineGBA/core/Cartridge.js"></script>

        <script src="IodineGBA/core/RunLoop.js"></script>
        <script src="IodineGBA/core/Memory.js"></script>

        <script src="IodineGBA/core/JoyPad.js"></script>
        <script src="IodineGBA/core/Serial.js"></script>
        <script src="IodineGBA/core/Sound.js"></script>
        <script src="IodineGBA/core/Timer.js"></script>
        <script src="IodineGBA/core/Wait.js"></script>

        <link rel="stylesheet" href="user_css/main.css">
    </head>
    <body>
        <canvas id="emulator_target" width="720" height="480"></canvas>


        <div class="flex justify-center space-x-4 mb-6">
            <button id="saveGameButton"
                class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                Manual Save
            </button>
            <button id="loadGameButton"
                class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-6 rounded-lg shadow-md transition duration-300 ease-in-out transform hover:scale-105">
                Manual Load
            </button>
        </div>

        <div id="messageBox" class="message-box hidden"></div>

        <p class="mt-2 text-center text-gray-600 text-sm font-semibold">
            Press <kbd class="bg-gray-200 px-2 py-1 rounded-md">Ctrl</kbd> + <kbd class="bg-gray-200 px-2 py-1 rounded-md">Q</kbd> to quick save!
            <br>
            Press <kbd class="bg-gray-200 px-2 py-1 rounded-md">Ctrl</kbd> + <kbd class="bg-gray-200 px-2 py-1 rounded-md">L</kbd> to quick load!
        </p>

        <script src="main.js"></script>

    </body>
</html>
